steps:
  # Build backend
  - name: 'gcr.io/cloud-builders/docker'
    # Context is ./backend, matching the COPY paths in Dockerfile.backend.
    # It was '.' (the repo root), so `COPY requirements.txt .` looked for a
    # file that only exists one directory down and the build never succeeded.
    args: ['build', '-t', 'gcr.io/${PROJECT_ID}/metis-backend:${SHORT_SHA}', '-f', 'deployment/Dockerfile.backend', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/metis-backend:${SHORT_SHA}']

  # Build frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/${PROJECT_ID}/metis-frontend:${SHORT_SHA}', '-f', 'deployment/Dockerfile.frontend', './frontend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/metis-frontend:${SHORT_SHA}']

  # Deploy backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: ['run', 'deploy', 'metis-backend', '--image', 'gcr.io/${PROJECT_ID}/metis-backend:${SHORT_SHA}', '--region', 'us-central1', '--platform', 'managed', '--allow-unauthenticated']

  # Deploy frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: ['run', 'deploy', 'metis-frontend', '--image', 'gcr.io/${PROJECT_ID}/metis-frontend:${SHORT_SHA}', '--region', 'us-central1', '--platform', 'managed', '--allow-unauthenticated']
